[workspace]
members = ["crates/jmespath-extensions", "xtask"]
# Python bindings are excluded from workspace to avoid PyO3 build issues
# The jmespath-extensions-py crate is built/released separately via the Python workflow
exclude = ["crates/jmespath-extensions-py"]
resolver = "2"
default-members = ["crates/jmespath-extensions"]

[workspace.package]
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/jmespath-extensions"
homepage = "https://github.com/joshrotenberg/jmespath-extensions"

[workspace.dependencies]
# Core dependencies
jmespath = "0.4"
serde = "1.0"
serde_json = "1.0"

# Optional library dependencies
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
crc32fast = "1.5"
base64 = "0.22"
urlencoding = "2.1"
regex = "1.5"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
rand = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
chrono-english = "0.1"
dateparser = "0.2"
strsim = "0.11"
rphonetic = "3.0"
geoutils = "0.5"
semver_crate = { package = "semver", version = "1.0" }
ipnetwork = "0.21"
nanoid = "0.4"
ulid = "1.1"
json-patch = "4.0"
aho-corasick = "1.1"
csv = "1.3"
whatlang = "0.18"
rust-stemmers = "1.2"
stop-words = "0.9"
unicode-normalization = "0.1"
heck = "0.5"

# Dev dependencies
criterion = { version = "0.5", features = ["html_reports"] }
