[workspace]
# Changelog configuration
changelog_update = true
git_tag_enable = true
# Validate semantic versioning
semver_check = true
# PR configuration
pr_labels = ["release"]

# Main library - release-plz creates GitHub release
[[package]]
name = "jmespath_extensions"
publish = true
git_release_enable = true
git_tag_name = "v{{ version }}"

# Note: jmespath-extensions-py is excluded from Cargo workspace and uses
# a separate python-release workflow, so it's not listed here.
#
# CLI tools (jpx, jpx-server) have moved to: https://github.com/joshrotenberg/jpx
