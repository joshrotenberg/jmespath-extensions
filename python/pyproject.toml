[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "jmespath-extensions"
version = "0.9.0"
description = "JMESPath with 400+ extension functions for strings, arrays, dates, hashing, encoding, and more"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Josh Rotenberg", email = "joshrotenberg@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
keywords = ["jmespath", "json", "query", "transform", "filter"]

[project.urls]
Homepage = "https://github.com/joshrotenberg/jmespath-extensions"
Repository = "https://github.com/joshrotenberg/jmespath-extensions"
Documentation = "https://github.com/joshrotenberg/jmespath-extensions#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "jmespath_extensions._core"
features = ["pyo3/extension-module"]
# Exclude root README to avoid conflict with python/README.md
exclude = ["../README.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
