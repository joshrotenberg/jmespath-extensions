[package]
name = "jmespath-extensions-py"
version = "0.1.0"
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/jmespath-extensions"
homepage = "https://github.com/joshrotenberg/jmespath-extensions"
description = "Python bindings for jmespath-extensions - 400+ functions for JMESPath queries"
readme = "README.md"
keywords = ["jmespath", "json", "query", "python", "pyo3"]
categories = ["api-bindings"]
# This crate is not published to crates.io - it's a Python package published to PyPI
publish = false

# Exclude from cargo-dist binary releases (it's a Python extension, not a standalone binary)
[package.metadata.dist]
dist = false

[lib]
name = "jmespath_extensions_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
jmespath = "0.4"
jmespath_extensions = { path = "../jmespath_extensions", features = ["full", "query-library"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde_json = "1.0"

[build-dependencies]
pyo3-build-config = "0.23"

[features]
default = []
