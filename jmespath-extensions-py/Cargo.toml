[package]
name = "jmespath-extensions-py"
version = "0.1.0"
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/jmespath-extensions"
homepage = "https://github.com/joshrotenberg/jmespath-extensions"
description = "Python bindings for jmespath-extensions - 320+ functions for JMESPath queries"
readme = "README.md"
keywords = ["jmespath", "json", "query", "python", "pyo3"]
categories = ["api-bindings"]

[lib]
name = "jmespath_extensions_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
jmespath.workspace = true
jmespath_extensions = { path = "../jmespath_extensions", features = ["full"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde_json.workspace = true

[build-dependencies]
pyo3-build-config = "0.23"

[features]
default = []
